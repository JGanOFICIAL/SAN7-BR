<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validador</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:#ffffff;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  color:#000000;
  padding:0 1rem 6rem;
}

header{
  width:100%;
  max-width:900px;
  padding:2.5rem 1rem 1.2rem;
  text-align:center;
}

.main-title{
  font-size:2.2rem;
  font-weight:700;
  letter-spacing:0.5px;
  color:#000000;
}

.sub-title{
  font-size:1rem;
  font-weight:400;
  color:#000000;
  margin-top:0.4rem;
  opacity:0.7;
}

.content{
  max-width:780px;
  width:100%;
  padding:1.5rem 0 3rem;
}

/* Bolinha preta grande e fina */
.loading-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:6rem 0;
  gap:1.6rem;
}

.big-spinner{
  width:220px;
  height:220px;
  border:1px solid #e5e5e5;
  border-top-color:#000000;
  border-radius:50%;
  animation:girar 1s linear infinite;
}

@keyframes girar{to{transform:rotate(360deg);}}

.loading-text{
  font-size:1rem;
  color:#000000;
  opacity:0.7;
  letter-spacing:0.5px;
}

.doc{
  padding:1rem 0 0.5rem;
  color:#000000;
}

.doc-linha{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:1rem;
  padding:0.85rem 0;
  border-bottom:1px dashed #d0d0d0;
  font-size:0.98rem;
  color:#000000;
}

.doc-linha:last-child{border-bottom:none;}

.doc-rotulo{color:#000000;opacity:0.65;font-weight:400;}
.doc-valor{color:#000000;font-weight:600;text-align:right;word-break:break-word;}

.na-borrado{
  filter:blur(4px);
  user-select:none;
  cursor:not-allowed;
  letter-spacing:1px;
}

.qr-area{
  margin-top:2rem;
  padding-top:1.5rem;
  border-top:2px solid #f0f0f0;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:0.8rem;
}

.qr-title{
  font-size:0.85rem;
  color:#000000;
  opacity:0.65;
  letter-spacing:1px;
}

.qr-box{
  background:#ffffff;
  padding:10px;
  border:1px solid #e5e5e5;
  border-radius:4px;
  display:inline-block;
}

.qr-box img,
.qr-box canvas{
  display:block;
  width:160px;
  height:160px;
}

.qr-id{
  font-size:0.9rem;
  color:#000000;
}

.qr-id strong{font-weight:700;letter-spacing:0.5px;}

.termos{
  margin-top:2.5rem;
  padding-top:1.5rem;
  border-top:1px dashed #d0d0d0;
  font-size:0.82rem;
  color:#000000;
  opacity:0.7;
  line-height:1.7;
}

.termos p{margin-bottom:0.5rem;}

.selo{
  text-align:center;
  padding:1.5rem 0 0.5rem;
}

.selo .check{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:64px;
  height:64px;
  border-radius:50%;
  background:#E8F5EE;
  color:#2E8B57;
  font-size:32px;
  font-weight:700;
  margin-bottom:0.8rem;
}

.selo .titulo{
  font-size:1.15rem;
  font-weight:700;
  color:#000000;
  margin-bottom:0.3rem;
}

.selo .desc{
  font-size:0.9rem;
  color:#000000;
  opacity:0.7;
}

.msg-erro{
  text-align:center;
  padding:2rem 1rem;
  color:#b3241c;
  font-size:0.95rem;
  line-height:1.7;
}

/* Botão flutuante circular com "V" no canto inferior esquerdo */
.btn-flutuante-voltar{
  position:fixed;
  bottom:24px;
  left:24px;
  width:56px;
  height:56px;
  border-radius:50%;
  background:#000000;
  color:#ffffff;
  border:none;
  cursor:pointer;
  box-shadow:0 6px 18px rgba(0,0,0,0.28);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-family:inherit;
  font-weight:700;
  line-height:1;
  transition:transform 0.15s, background 0.15s;
  z-index:100;
}

.btn-flutuante-voltar:hover{background:#333333;transform:scale(1.06);}

.rodape-min{
  width:100%;
  max-width:900px;
  text-align:center;
  padding:1rem 0 2rem;
  font-size:0.75rem;
  color:#000000;
  opacity:0.5;
  letter-spacing:0.5px;
}
</style>
</head>
<body>

<header>
  <h1 class="main-title">Validador</h1>
  <div class="sub-title">Conferência de comprovante de ponto</div>
</header>

<div class="content" id="conteudo"></div>

<div class="rodape-min">Academia DomusFit</div>

<button class="btn-flutuante-voltar" id="btnVoltar" title="Voltar" onclick="voltarIndex()">V</button>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBPiznHCVkTAgx6m02bZB8b0FFaot9UkBU",
  authDomain: "prefeitura-de-joao-camara.firebaseapp.com",
  projectId: "prefeitura-de-joao-camara",
  storageBucket: "prefeitura-de-joao-camara.firebasestorage.app",
  databaseURL: "https://prefeitura-de-joao-camara-default-rtdb.firebaseio.com"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const conteudo = document.getElementById('conteudo');

const params = new URLSearchParams(window.location.search);
const idValidador = params.get('id');

function voltarIndex(){
  window.location.href = "index2.html";
}

/* ============================================================
   AUTO-RETORNO OBRIGATÓRIO EM 2 SEGUNDOS
   Sempre volta para index2.html após 2s, independente de
   sessão ativa ou não.
   ============================================================ */
setTimeout(voltarIndex, 2000);

function escapar(txt){
  if(txt === null || txt === undefined) return '--';
  return String(txt)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function renderLoading(msg){
  conteudo.innerHTML = `
    <div class="loading-wrap">
      <div class="big-spinner"></div>
      <div class="loading-text">${msg || 'Carregando comprovante...'}</div>
    </div>
  `;
}

function renderErro(msg){
  conteudo.innerHTML = `<div class="msg-erro">${msg}</div>`;
}

function gerarCheck(id, na){
  const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const seed = (id + '|' + na + '|DOMUSFIT');
  let h = 0;
  for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
  let out = '';
  let x = h;
  for (let i = 0; i < 40; i++) {
    x = (x * 1103515245 + 12345) >>> 0;
    out += chars.charAt(x % chars.length);
  }
  return out;
}

function gerarUrlScanner(d){
  let mes = '', ano = '', serie = d.na, check = '';
  try {
    if (d.data && d.data.indexOf('/') > -1) {
      const partes = d.data.split('/');
      if (partes.length === 3) {
        mes = parseInt(partes[1], 10);
        ano = partes[2];
      }
    }
  } catch(e){}

  check = gerarCheck(d.id || '00000000', serie);

  const base = window.location.href.replace(/[^/]*$/, '');
  const url = `${base}scaner.html?serie=${encodeURIComponent(serie)}&mes=${mes}&ano=${ano}&check=${encodeURIComponent(check)}`;
  return url;
}

function renderComprovante(d){
  const naTexto = d.na ? String(d.na) : '--';

  conteudo.innerHTML = `
    <div class="selo">
      <div class="check">✓</div>
      <div class="titulo">Documento oficial verificado</div>
      <div class="desc">Este comprovante é autêntico e foi emitido pelo sistema de ponto DomusFit.</div>
    </div>

    <div class="doc" style="margin-top:1.5rem;">
      <div class="doc-linha"><span class="doc-rotulo">Nome</span><span class="doc-valor">${escapar(d.nome)}</span></div>
      <div class="doc-linha"><span class="doc-rotulo">Número de acesso</span><span class="doc-valor na-borrado" title="Dado protegido">${escapar(naTexto)}</span></div>
      <div class="doc-linha"><span class="doc-rotulo">Data</span><span class="doc-valor">${escapar(d.data)}</span></div>
      <div class="doc-linha"><span class="doc-rotulo">Hora de finalização</span><span class="doc-valor">${escapar(d.hora)}</span></div>
      <div class="doc-linha"><span class="doc-rotulo">Cálculo de verificação</span><span class="doc-valor">${escapar(d.calculo)}</span></div>
      <div class="doc-linha"><span class="doc-rotulo">ID do documento</span><span class="doc-valor">${escapar(d.id)}</span></div>
      <div class="doc-linha"><span class="doc-rotulo">Status</span><span class="doc-valor">Autêntico</span></div>
    </div>

    <div class="qr-area">
      <div class="qr-title">Consulta por QR Code</div>
      <div class="qr-box" id="qrBox"></div>
      <div class="qr-id">ID do comprovante: <strong>${escapar(d.id)}</strong></div>
    </div>

    <div class="termos">
      <p>Este comprovante é emitido automaticamente pelo sistema de ponto DomusFit e pode ser validado por meio do QR Code acima ou pelo ID informado.</p>
      <p>A consulta é pública, gratuita e não permite alteração dos dados originais. Em caso de divergência, procure o suporte da Academia DomusFit.</p>
    </div>
  `;

  // Gera QR Code
  const urlScanner = gerarUrlScanner(d);
  const qrBox = document.getElementById('qrBox');
  qrBox.innerHTML = '';
  if (typeof QRCode !== 'undefined') {
    new QRCode(qrBox, {
      text: urlScanner,
      width: 160,
      height: 160,
      colorDark: "#000000",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });
  } else {
    qrBox.innerHTML = '<div style="padding:20px;font-size:12px;color:#666;">QR Code indisponível</div>';
  }
}

function iniciar(){
  if(!idValidador){
    renderErro('Nenhum ID de validação foi informado.<br>Verifique o link recebido e tente novamente.');
    return;
  }

  renderLoading('Carregando comprovante...');

  db.ref("comprovantes/" + idValidador).once("value").then(snap => {
    if(!snap.exists()){
      renderErro('Comprovante não encontrado.<br>O ID informado não corresponde a nenhum registro válido.');
      return;
    }
    renderComprovante(snap.val());
  }).catch(err => {
    console.error(err);
    renderErro('Não foi possível carregar o comprovante.<br>Tente novamente em alguns instantes.');
  });
}

iniciar();
</script>
</body>
</html>
