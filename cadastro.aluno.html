<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAN7DOC • Sistema de Gestão</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #007aff;
            --primary-dark: #005fc1;
            --primary-light: #e3f2ff;
            --success: #34c759;
            --success-light: #e8f5e9;
            --warning: #ff9500;
            --danger: #ff3b30;
            --danger-light: #ffebee;
            --danger-dark: #d70015;
            --text-primary: #1c1c1e;
            --text-secondary: #8e8e93;
            --border-light: rgba(60, 60, 67, 0.08);
            --border-medium: rgba(60, 60, 67, 0.12);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04), 0 0 0 0.5px rgba(0, 0, 0, 0.02);
            --shadow-md: 0 8px 28px rgba(0, 0, 0, 0.08), 0 0 0 0.5px rgba(0, 0, 0, 0.02);
            --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.12), 0 0 0 0.5px rgba(0, 0, 0, 0.03);
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --sidebar-width: 280px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            background: #f5f7fa;
            display: flex;
            flex-direction: column;
        }

        /* Background GIF - retangular, não flutuante */
        .bg-gif-container {
            width: 100%;
            height: 140px;
            overflow: hidden;
            position: relative;
            background: #000;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border-medium);
        }
        .bg-gif-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.9;
            display: block;
        }

        /* Layout principal */
        .app-layout {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        /* Menu Lateral - Desktop fica aberto, Mobile escondido */
        .side-menu {
            width: var(--sidebar-width);
            background: white;
            border-right: 1px solid var(--border-medium);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            z-index: 100;
            height: calc(100vh - 140px);
            overflow-y: auto;
        }

        .side-menu .menu-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-medium);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .side-menu .menu-header h3 {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.3px;
        }
        .menu-close-mobile {
            display: none;
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            background: var(--border-light);
            border: none;
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }
        .menu-items {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .menu-item {
            padding: 14px 16px;
            border-radius: var(--radius-md);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 14px;
            font-weight: 500;
            font-size: 15px;
            color: var(--text-primary);
            transition: all 0.15s;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }
        .menu-item:hover {
            background: var(--primary-light);
            color: var(--primary);
        }
        .menu-item.active {
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 600;
        }
        .menu-item svg {
            flex-shrink: 0;
        }

        /* Área de conteúdo */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            height: calc(100vh - 140px);
            overflow-y: auto;
        }

        header.top-bar {
            background: white;
            border-bottom: 1px solid var(--border-medium);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .menu-toggle-mobile {
            display: none;
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            background: white;
            border: 1px solid var(--border-medium);
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-icon {
            width: 32px;
            height: 32px;
            background: var(--primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-text {
            font-weight: 700;
            font-size: 15px;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
            width: 100%;
        }

        /* Welcome card */
        .welcome-card {
            background: white;
            border-radius: var(--radius-lg);
            padding: 28px 32px;
            margin-bottom: 24px;
            border: 1px solid var(--border-medium);
            box-shadow: var(--shadow-sm);
        }
        .welcome-title {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }
        .welcome-sub {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* Action Bar */
        .action-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .action-btn {
            background: white;
            border: 1px solid var(--border-medium);
            padding: 10px 18px;
            border-radius: var(--radius-lg);
            font-weight: 500;
            font-size: 13px;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 7px;
            transition: all 0.15s ease;
            box-shadow: var(--shadow-sm);
        }
        .action-btn:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary);
        }
        .action-btn.panic {
            background: var(--danger);
            color: white;
            border: none;
        }
        .action-btn.panic:hover {
            background: var(--danger-dark);
        }

        /* Inputs */
        .search-box, .field input, .field textarea, .field select {
            width: 100%;
            padding: 14px 16px;
            background: white;
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 500;
            transition: all 0.15s;
            outline: none;
            font-family: inherit;
            color: var(--text-primary);
        }
        .search-box:focus, .field input:focus, .field textarea:focus, .field select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
        }
        .field input.invalid, .field textarea.invalid, .field select.invalid {
            border-color: var(--danger) !important;
            box-shadow: 0 0 0 3px rgba(255, 59, 48, 0.1) !important;
        }
        .field {
            margin-bottom: 16px;
        }
        .field label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-new, .btn-save, .btn-secondary, .btn-danger, .keys-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 13px 26px;
            border-radius: var(--radius-lg);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.15s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: var(--shadow-sm);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-new:hover, .btn-save:hover, .keys-btn:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
            background: var(--primary-dark);
        }
        .btn-danger {
            background: var(--danger);
        }
        .btn-danger:hover {
            background: var(--danger-dark);
        }
        .btn-secondary {
            background: var(--text-secondary);
        }
        .btn-secondary:hover {
            background: #6c6c70;
        }

        /* Tabela */
        .table-container {
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            overflow-x: auto;
            border: 1px solid var(--border-medium);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }
        th {
            padding: 16px 20px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-medium);
            background: #fafafc;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        td {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-light);
            cursor: pointer;
            background: white;
            font-size: 14px;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover td {
            background: var(--primary-light);
        }
        .na-cell {
            font-weight: 700;
            font-family: 'SF Mono', 'Courier New', monospace;
            font-size: 15px;
            color: var(--primary);
        }
        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .badge-active {
            background: var(--success-light);
            color: var(--success);
        }
        .badge-expired {
            background: var(--danger-light);
            color: var(--danger);
        }

        /* Barra de progresso estilo Windows */
        .win-progress-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
        .win-progress-box {
            background: white;
            border-radius: var(--radius-md);
            padding: 24px 28px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-medium);
            min-width: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .win-progress-bar {
            width: 240px;
            height: 6px;
            background: #e8e8ed;
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }
        .win-progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: -40%;
            width: 40%;
            height: 100%;
            background: var(--primary);
            border-radius: 3px;
            animation: winProgress 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        @keyframes winProgress {
            0% { left: -40%; }
            100% { left: 100%; }
        }
        .win-progress-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        /* Overlay nome do desenvolvedor */
        .dev-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10001;
            animation: devFadeIn 0.3s ease;
        }
        .dev-overlay.active {
            display: flex;
        }
        @keyframes devFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .dev-name {
            font-size: 42px;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: 4px;
            font-family: 'Inter', sans-serif;
            text-shadow: 0 4px 20px rgba(0, 122, 255, 0.2);
        }
        @media (max-width: 700px) {
            .dev-name {
                font-size: 32px;
                letter-spacing: 3px;
            }
        }

        /* Modais */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }
        .modal {
            background: white;
            border-radius: var(--radius-xl);
            width: 92%;
            max-width: 550px;
            max-height: 88vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            animation: modalFadeIn 0.2s ease;
        }
        .modal.large {
            max-width: 850px;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border-medium);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: white;
            border-radius: var(--radius-xl) var(--radius-xl) 0 0;
            z-index: 1;
        }
        .modal-header h2 {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .modal-close {
            width: 34px;
            height: 34px;
            border-radius: var(--radius-sm);
            background: var(--border-light);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }
        .modal-close:hover {
            background: var(--border-medium);
        }
        .modal-content {
            padding: 24px;
        }
        .keys-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 14px;
        }
        .key-card {
            background: white;
            border: 2px solid var(--border-medium);
            border-radius: var(--radius-md);
            padding: 16px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .key-card.available {
            background: var(--success-light);
            border-color: var(--success);
        }
        .key-card.available .key-number {
            color: var(--success);
        }
        .key-card.available .key-status {
            color: var(--success);
            font-weight: 600;
            font-size: 12px;
        }
        .key-card.occupied {
            background: var(--danger-light);
            border-color: var(--danger);
        }
        .key-card.occupied .key-number {
            color: var(--danger);
        }
        .key-card.occupied .key-status {
            color: var(--danger);
            font-weight: 600;
            font-size: 12px;
        }
        .key-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }
        .key-card .key-number {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .key-card .key-user {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
            margin-top: 2px;
        }
        .key-card .key-datetime {
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        .btn-clear-key {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--danger);
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            transition: all 0.15s;
            line-height: 1;
        }
        .btn-clear-key:hover {
            transform: scale(1.15);
            background: var(--danger-dark);
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }
        .video-card {
            border-radius: var(--radius-md);
            overflow: hidden;
            cursor: pointer;
            border: 1px solid var(--border-medium);
            transition: all 0.15s;
            background: white;
        }
        .video-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }
        .video-card img {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            display: block;
        }
        .video-card p {
            padding: 10px 12px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-primary);
            line-height: 1.4;
        }
        .items-list {
            max-height: 380px;
            overflow-y: auto;
        }
        .list-item {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            gap: 12px;
        }
        .list-item:last-child {
            border-bottom: none;
        }
        .list-item strong {
            font-size: 14px;
            font-weight: 600;
        }
        .list-item small {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .na-alert {
            display: none;
            background: var(--primary-light);
            padding: 16px;
            border-radius: var(--radius-md);
            margin-bottom: 16px;
            text-align: center;
        }
        .na-alert .na-number {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary);
        }
        .na-alert .na-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        .field-row {
            display: flex;
            gap: 12px;
        }
        .field-row .field {
            flex: 1;
        }

        /* Menu overlay mobile */
        .menu-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            z-index: 99;
            display: none;
        }
        .menu-overlay.active {
            display: block;
        }

        /* Responsividade */
        @media (max-width: 900px) {
            .side-menu {
                position: fixed;
                top: 0;
                left: 0;
                height: 100vh;
                transform: translateX(-100%);
                z-index: 200;
                border-right: none;
                box-shadow: var(--shadow-lg);
                width: 300px;
            }
            .side-menu.open {
                transform: translateX(0);
            }
            .menu-close-mobile {
                display: flex;
            }
            .menu-toggle-mobile {
                display: flex;
            }
            .content-area {
                height: auto;
                min-height: calc(100vh - 140px);
            }
            .bg-gif-container {
                height: 100px;
            }
            .side-menu .menu-header h3 {
                font-size: 14px;
            }
        }

        @media (max-width: 700px) {
            .container {
                padding: 16px;
            }
            .welcome-card {
                padding: 20px;
            }
            .welcome-title {
                font-size: 20px;
            }
            .action-btn {
                padding: 9px 14px;
                font-size: 12px;
            }
            .field-row {
                flex-direction: column;
                gap: 0;
            }
            .keys-grid {
                grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
                gap: 10px;
            }
            .key-card {
                min-height: 95px;
                padding: 12px 8px;
            }
            .grid-3 {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
            .modal {
                width: 95%;
                max-height: 92vh;
            }
            .header-top-bar {
                padding: 10px 16px;
            }
            .logo-text {
                font-size: 13px;
            }
            .search-area {
                flex-direction: column;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--text-secondary);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }
    </style>
</head>
<body>

<!-- GIF de fundo retangular no topo -->
<div class="bg-gif-container">
    <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhntYLwluptcvGGk78e-_7GXQMRfj9UfwkDy7RUp9mSDxxZ-TD2O5DAtkUN_hyEk9I2fBA5N3IXbCVONiw9VIRaXDFAGuZI6KWASnt8pN8YP9s_7pwVoTOzzc1OPCbvI98qmzQLMsDblTpAe2TaUDwrYXYKGdCTdUFTFwGosrAQ4bFxLjsTn8VFkGUcV5pE/s400/BEE08ABC-CE1E-43AA-BFA4-E5FC30942A50.gif" alt="Background">
</div>

<!-- Overlay de carregamento estilo Windows -->
<div class="win-progress-overlay" id="winProgressOverlay">
    <div class="win-progress-box">
        <div class="win-progress-bar"></div>
        <div class="win-progress-label" id="winProgressLabel">Carregando...</div>
    </div>
</div>

<!-- Overlay do desenvolvedor -->
<div class="dev-overlay" id="devOverlay">
    <div class="dev-name">SAN7DOC</div>
</div>

<!-- Menu overlay mobile -->
<div class="menu-overlay" id="menuOverlay"></div>

<div class="app-layout">
    <!-- Menu Lateral -->
    <aside class="side-menu" id="sideMenu">
        <div class="menu-header">
            <h3>SAN7DOC TECNOLOGIA</h3>
            <button class="menu-close-mobile" id="closeMenuBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>

<script>
    // ========== FIREBASE ==========
    const firebaseConfig = {
        apiKey: "AIzaSyBPiznHCVkTAgx6m02bZB8b0FFaot9UkBU",
        authDomain: "prefeitura-de-joao-camara.firebaseapp.com",
        projectId: "prefeitura-de-joao-camara",
        storageBucket: "prefeitura-de-joao-camara.firebasestorage.app",
        messagingSenderId: "269299041577",
        appId: "1:269299041577:web:fd41b2939240e9eb476338"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let USERS = {};
    let KEYS_DATA = {};
    let aulasExpData = {};
    const YOUTUBE_API_KEY = "AIzaSyDS9f8LJEx1CFkDdmVF5AoK02hkNvxBCEE";

    // ========== CONTROLE DE FERRAMENTA ATIVA ==========
    let activeTool = null;

    function abrirFerramenta(tool) {
        activeTool = tool;
        // Remove active de todos os menu items
        document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));

        // Fecha menu mobile se estiver aberto
        if (window.innerWidth <= 900) {
            closeMenu();
        }

        // Renderiza conteúdo da ferramenta
        const container = document.getElementById('mainContainer');

        if (tool === 'chaves') {
            renderChaves(container);
        } else if (tool === 'cadastros') {
            renderCadastros(container);
        } else if (tool === 'aulas') {
            renderAulas(container);
        } else if (tool === 'notas') {
            renderNotas(container);
        } else if (tool === 'panic') {
            renderPanic(container);
        } else if (tool === 'jogos') {
            renderJogos(container);
        }
    }

    // ========== UTILITÁRIOS ==========
    function showWinProgress(label = "Carregando...") {
        document.getElementById('winProgressLabel').textContent = label;
        document.getElementById('winProgressOverlay').style.display = 'flex';
    }
    function hideWinProgress() {
        document.getElementById('winProgressOverlay').style.display = 'none';
    }
    function showDevName() {
        const overlay = document.getElementById('devOverlay');
        overlay.classList.add('active');
        setTimeout(() => {
            overlay.classList.remove('active');
        }, 2000);
    }
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function abrirModalCustom(id) { openModal(id); }
    function closeModalOnOut(e, id) {
        if (e.target.classList.contains('modal-overlay')) closeModal(id);
    }
    function fecharPlayer() {
        document.getElementById('player').src = "";
        closeModal('modalPlayer');
    }

    // ========== MENU MOBILE ==========
    const menuToggleMobile = document.getElementById('menuToggleMobile');
    const sideMenu = document.getElementById('sideMenu');
    const menuOverlay = document.getElementById('menuOverlay');
    const closeMenuBtn = document.getElementById('closeMenuBtn');

    function openMenu() {
        sideMenu.classList.add('open');
        menuOverlay.classList.add('active');
    }
    function closeMenu() {
        sideMenu.classList.remove('open');
        menuOverlay.classList.remove('active');
    }
    menuToggleMobile.onclick = openMenu;
    closeMenuBtn.onclick = closeMenu;
    menuOverlay.onclick = closeMenu;

    // ========== CÁLCULO DE DIAS ==========
    function calcularDiasRestantes(dataTermino) {
        if (!dataTermino) return 'N/A';
        const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
        const termino = new Date(dataTermino); termino.setHours(0, 0, 0, 0);
        const diff = Math.ceil((termino - hoje) / (1000 * 60 * 60 * 24));
        if (diff < 0) return 'VENCIDO';
        if (diff === 0) return 'VENCE HOJE';
        if (diff === 1) return 'VENCE AMANHÃ';
        return `${diff} DIAS`;
    }

    // ========== VALIDAÇÃO DE INPUTS ==========
    function validarInput(input) {
        if (!input.value.trim()) {
            input.classList.add('invalid');
            return false;
        }
        input.classList.remove('invalid');
        return true;
    }
    function limparInvalidos(container) {
        container.querySelectorAll('input, textarea, select').forEach(el => el.classList.remove('invalid'));
    }

    // ========== FERRAMENTA: CHAVES ==========
    function renderChaves(container) {
        // Sincroniza dados
        db.ref('chaves').on('value', snap => {
            KEYS_DATA = snap.val() || {};
            renderKeysGrid();
        });

        container.innerHTML = `
            <div class="welcome-card">
                <div class="welcome-title">Gestão de Chaves</div>
                <div class="welcome-sub">Controle de chaves do estabelecimento — verde = disponível, vermelho = em uso</div>
            </div>
            <div class="keys-grid" id="keysGridContainer"></div>
        `;
        renderKeysGrid();
    }

    function renderKeysGrid() {
        const container = document.getElementById('keysGridContainer');
        if (!container) return;
        container.innerHTML = '';
        for (let i = 1; i <= 24; i++) {
            const keyInfo = KEYS_DATA[i];
            const isOccupied = !!keyInfo;
            const div = document.createElement('div');
            div.className = `key-card ${isOccupied ? 'occupied' : 'available'}`;

            if (isOccupied) {
                div.innerHTML = `
                    <button class="btn-clear-key" onclick="clearKey(event, ${i})" title="Liberar chave">✕</button>
                    <div class="key-number">CHAVE ${String(i).padStart(2, '0')}</div>
                    <div class="key-user">${keyInfo.user}</div>
                    <div class="key-datetime">${keyInfo.date} ${keyInfo.time || ''}</div>
                    <div class="key-status">EM USO</div>
                `;
                div.onclick = (e) => {
                    if (e.target.classList.contains('btn-clear-key')) return;
                    // Reatribuir? Não, apenas mostra info
                };
            } else {
                div.innerHTML = `
                    <div class="key-number">CHAVE ${String(i).padStart(2, '0')}</div>
                    <div class="key-status">DISPONÍVEL</div>
                `;
                div.onclick = () => openAssignKey(i);
            }
            container.appendChild(div);
        }
    }

    function openAssignKey(num) {
        document.getElementById('key-number-val').value = num;
        document.getElementById('assign-title').innerText = `CHAVE ${String(num).padStart(2, '0')}`;
        document.getElementById('key-user-name').value = '';
        document.getElementById('key-user-name').classList.remove('invalid');
        openModal('modalAssignKey');
    }

    async function saveKeyAssignment() {
        const num = document.getElementById('key-number-val').value;
        const user = document.getElementById('key-user-name').value.trim();
        if (!user) {
            document.getElementById('key-user-name').classList.add('invalid');
            return;
        }
        showWinProgress("Registrando posse...");
        const now = new Date();
        await db.ref('chaves/' + num).set({
            user,
            date: now.toLocaleDateString('pt-BR'),
            time: now.toLocaleTimeString('pt-BR')
        });
        closeModal('modalAssignKey');
        hideWinProgress();
        showDevName();
    }

    async function clearKey(e, num) {
        e.stopPropagation();
        if (confirm(`Liberar chave ${num}?`)) {
            showWinProgress("Liberando chave...");
            await db.ref('chaves/' + num).remove();
            hideWinProgress();
            showDevName();
        }
    }

    // ========== FERRAMENTA: CADASTROS ==========
    function renderCadastros(container) {
        db.ref('users').on('value', snap => {
            USERS = snap.val() || {};
            renderTable();
        });

        container.innerHTML = `
            <div class="welcome-card">
                <div class="welcome-title" id="editableTitle" contenteditable="true">ACADEMIA DOMUSFIT</div>
                <div class="welcome-sub">Gerencie alunos, planos e renovações</div>
            </div>
            <div style="display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; align-items:center;">
                <input type="text" id="search" class="search-box" placeholder="Pesquisar por aluno ou NA..." oninput="renderTable()" style="flex:1; min-width:200px;">
                <button class="btn-new" onclick="openModal('modalAdd')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    NOVO ALUNO
                </button>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr><th>NA</th><th>NOME DO ALUNO</th><th>PLANO</th><th>STATUS / DIAS</th></tr>
                    </thead>
                    <tbody id="aluno-list"></tbody>
                </table>
            </div>
        `;

        // Título editável
        const editableTitle = document.getElementById('editableTitle');
        if (editableTitle) {
            editableTitle.addEventListener('blur', function() {
                localStorage.setItem('systemTitle', this.innerText);
            });
            if (localStorage.getItem('systemTitle')) {
                editableTitle.innerText = localStorage.getItem('systemTitle');
            }
        }
    }

    function renderTable() {
        const tbody = document.getElementById('aluno-list');
        if (!tbody) return;
        const searchInput = document.getElementById('search');
        const search = searchInput ? searchInput.value.toLowerCase() : '';
        tbody.innerHTML = '';
        const today = new Date(); today.setHours(0, 0, 0, 0);

        Object.keys(USERS).sort().forEach(na => {
            const u = USERS[na];
            if (!u.name) return;
            if ((u.name.toLowerCase() + ' ' + na).includes(search) || search === '') {
                const expired = !u.endDate || new Date(u.endDate) < today;
                const dias = calcularDiasRestantes(u.endDate);
                const tr = document.createElement('tr');
                tr.onclick = () => openEdit(na, u);
                tr.innerHTML = `
                    <td class="na-cell">${na}</td>
                    <td><strong>${u.name}</strong></td>
                    <td>${u.planName || '---'}</td>
                    <td>
                        <span class="badge ${expired ? 'badge-expired' : 'badge-active'}">${expired ? 'INATIVO' : 'ATIVO'}</span>
                        <div style="font-size:11px;margin-top:4px;color:var(--text-secondary);">${dias}</div>
                    </td>
                `;
                tbody.appendChild(tr);
            }
        });
    }

    async function saveNewUser() {
        const nameInput = document.getElementById('add-name');
        const phoneInput = document.getElementById('add-phone');
        const addressInput = document.getElementById('add-address');
        const planInput = document.getElementById('add-plan');
        const startInput = document.getElementById('add-start');
        const endInput = document.getElementById('add-end');

        // Validação
        const name = nameInput.value.trim();
        const phone = phoneInput.value.trim();
        const address = addressInput.value.trim();
        const end = endInput.value;

        if (!name) { nameInput.classList.add('invalid'); return; }
        if (!phone) { phoneInput.classList.add('invalid'); return; }
        if (!address) { addressInput.classList.add('invalid'); return; }
        if (!end) { endInput.classList.add('invalid'); return; }

        limparInvalidos(document.getElementById('modalAdd'));

        showWinProgress("Cadastrando aluno...");
        const na = Math.floor(10000 + Math.random() * 90000).toString();
        await db.ref('users/' + na).set({
            name,
            phone,
            address,
            planName: planInput.value || 'Sem Plano',
            startDate: startInput.value || new Date().toISOString().split('T')[0],
            endDate: end,
            active: true,
            createdAt: new Date().toISOString().split('T')[0]
        });

        document.getElementById('naNumber').innerText = na;
        document.getElementById('naAlert').style.display = 'block';

        // Limpa campos
        nameInput.value = '';
        phoneInput.value = '';
        addressInput.value = '';
        planInput.value = '';
        startInput.value = '';
        endInput.value = '';

        hideWinProgress();
        showDevName();

        setTimeout(() => {
            closeModal('modalAdd');
            document.getElementById('naAlert').style.display = 'none';
        }, 3000);
    }

    function openEdit(na, u) {
        document.getElementById('edit-na-val').value = na;
        document.getElementById('edit-na-display').innerText = na;
        document.getElementById('edit-name').value = u.name || '';
        document.getElementById('edit-phone').value = u.phone || '';
        document.getElementById('edit-address').value = u.address || '';
        document.getElementById('edit-plan').value = u.planName || '';
        document.getElementById('edit-start').value = u.startDate || '';
        document.getElementById('edit-end').value = u.endDate || '';
        document.getElementById('diasRestantes').innerText = calcularDiasRestantes(u.endDate);
        limparInvalidos(document.getElementById('modalEdit'));
        openModal('modalEdit');
    }

    async function updateUser() {
        const na = document.getElementById('edit-na-val').value;
        const nameInput = document.getElementById('edit-name');
        const phoneInput = document.getElementById('edit-phone');
        const addressInput = document.getElementById('edit-address');
        const endInput = document.getElementById('edit-end');

        if (!nameInput.value.trim()) { nameInput.classList.add('invalid'); return; }
        if (!phoneInput.value.trim()) { phoneInput.classList.add('invalid'); return; }
        if (!addressInput.value.trim()) { addressInput.classList.add('invalid'); return; }
        if (!endInput.value) { endInput.classList.add('invalid'); return; }

        limparInvalidos(document.getElementById('modalEdit'));
        showWinProgress("Atualizando dados...");
        await db.ref('users/' + na).update({
            name: nameInput.value.trim(),
            phone: phoneInput.value.trim(),
            address: addressInput.value.trim(),
            planName: document.getElementById('edit-plan').value,
            startDate: document.getElementById('edit-start').value,
            endDate: endInput.value
        });
        closeModal('modalEdit');
        hideWinProgress();
    }

    async function renovatePlan() {
        const na = document.getElementById('edit-na-val').value;
        let base = new Date();
        const currentEnd = document.getElementById('edit-end').value;
        if (currentEnd) {
            const endDate = new Date(currentEnd);
            if (endDate > base) base = endDate;
        }
        base.setDate(base.getDate() + 30);
        const newEnd = base.toISOString().split('T')[0];
        showWinProgress("Renovando plano...");
        await db.ref('users/' + na).update({ endDate: newEnd, active: true });
        document.getElementById('edit-end').value = newEnd;
        document.getElementById('diasRestantes').innerText = calcularDiasRestantes(newEnd);
        hideWinProgress();
        showDevName();
    }

    async function deleteUser() {
        const na = document.getElementById('edit-na-val').value;
        const name = document.getElementById('edit-name').value;
        if (confirm(`Excluir ${name}?`)) {
            showWinProgress("Excluindo aluno...");
            await db.ref('users/' + na).remove();
            closeModal('modalEdit');
            hideWinProgress();
            showDevName();
        }
    }

    // ========== FERRAMENTA: AULAS EXPERIMENTAIS ==========

        db.ref('aulas_experimentais').on('value', snap => {

        });

        container.innerHTML = `
            <div class="welcome-card">
                <div class="welcome-title">Aulas Experimentais</div>
                <div class="welcome-sub">Cadastre e gerencie aulas experimentais com nome, telefone, endereço e sexo</div>
            </div>
            <div style="background:white; border-radius:16px; padding:24px; border:1px solid var(--border-medium); box-shadow:var(--shadow-sm); margin-bottom:24px;">
                <div style="font-size:13px; font-weight:700; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:16px;">Nova Aula Experimental</div>
                <div class="field">
                    <label>NOME COMPLETO *</label>
                    <input id="aulaNome" placeholder="Nome completo do aluno">
                </div>
                <div class="field-row">

                        <label>TELEFONE *</label>

                    </div>

                            <option value="Feminino">Feminino</option>
                        </select>
                    </div>
                </div>
                <div class="field">
                    <label>ENDEREÇO (BAIRRO E RUA) *</label>
                    <input id="aulaEndereco" placeholder="Ex: Centro, Rua das Flores">
                </div>
                <button class="btn-save" onclick="cadastrarAulaExperimental()" style="width:100%;">CADASTRAR AULA EXPERIMENTAL</button>
            </div>
            <div style="margin-bottom:16px;">
                <input id="buscaAluno" class="search-box" placeholder="Pesquisar por nome..." oninput="filtrarAulasExperimentais()">

            <div class="items-list" id="listaAlunos" style="background:white; border-radius:16px; border:1px solid var(--border-medium); max-height:400px; overflow-y:auto;"></div>

        renderAulasExperimentaisLista();

    function renderAulasExperimentaisLista() {
        const lista = document.getElementById('listaAlunos');
        if (!lista) return;
        lista.innerHTML = '';
        const data = aulasExpData;
        if (data) {
            Object.keys(data).reverse().forEach(id => {
                const a = data[id];
                const div = document.createElement('div');
                div.className = 'list-item';
                div.setAttribute('data-nome', (a.nome || '').toLowerCase());
                div.innerHTML = `
                    <div>
                        <strong>${a.nome}</strong><br>
                        <small>${a.telefone || a.tel || ''} • ${a.sexo || ''} • ${a.endereco || ''}</small>
                    </div>
                    <button style="background:var(--danger);color:white;border:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px;" onclick="deletarAulaExp('${id}',event)">✕</button>
                `;
                lista.appendChild(div);
            });
        }
    }

    function filtrarAulasExperimentais() {
        const filtro = document.getElementById('buscaAluno').value.toLowerCase();
        document.querySelectorAll('#listaAlunos .list-item').forEach(item => {
            const nome = item.getAttribute('data-nome');
            item.style.display = nome.includes(filtro) || !filtro ? 'flex' : 'none';
        });
    }

    async function cadastrarAulaExperimental() {
        const nomeInput = document.getElementById('aulaNome');
        const telInput = document.getElementById('aulaTelefone');
        const sexoInput = document.getElementById('aulaSexo');
        const endInput = document.getElementById('aulaEndereco');

        const nome = nomeInput.value.trim();
        const tel = telInput.value.trim();
        const sexo = sexoInput.value;
        const endereco = endInput.value.trim();

        if (!nome) { nomeInput.classList.add('invalid'); return; }
        if (!tel) { telInput.classList.add('invalid'); return; }
        if (!sexo) { sexoInput.classList.add('invalid'); return; }
        if (!endereco) { endInput.classList.add('invalid'); return; }

        limparInvalidos(document.getElementById('aulaNome').closest('.container') || document.body);

        showWinProgress("Cadastrando aula experimental...");
        await db.ref('aulas_experimentais').push({
            nome,
            telefone: tel,
            sexo,
            endereco,
            data: Date.now()
        });

        nomeInput.value = '';
        telInput.value = '';
        sexoInput.value = '';
        endInput.value = '';

        hideWinProgress();
        showDevName();
    }

    async function deletarAulaExp(id, e) {
        e.stopPropagation();
        if (confirm("Excluir esta aula experimental?")) {
            showWinProgress("Excluindo...");
            await db.ref('aulas_experimentais/' + id).remove();
            hideWinProgress();
        }
    }

    // ========== FERRAMENTA: NOTAS ==========
    function renderNotas(container) {
        db.ref('anotacoes').on('value', snap => {
            const lista = document.getElementById('listaNotas');
            if (!lista) return;
            lista.innerHTML = '';
            const data = snap.val();
            if (data) {
                Object.keys(data).reverse().forEach(id => {
                    const n = data[id];
                    const div = document.createElement('div');
                    div.className = 'list-item';
                    div.style.cursor = 'pointer';
                    div.innerHTML = `
                        <div>
                            <strong>${n.titulo}</strong><br>
                            <small>${n.data} ${n.hora}</small>
                        </div>
                        <span style="color:var(--text-secondary);">→</span>
                    `;
                    div.onclick = () => verNota(id, n);
                    lista.appendChild(div);
                });
            }
        });

        container.innerHTML = `
            <div class="welcome-card">
                <div class="welcome-title">Anotações</div>
                <div class="welcome-sub">Registre e consulte anotações importantes</div>
            </div>
            <button class="btn-save" style="margin-bottom:20px;" onclick="abrirModalCustom('modalNovaNota')">NOVA ANOTAÇÃO</button>
            <div class="items-list" id="listaNotas" style="background:white; border-radius:16px; border:1px solid var(--border-medium); max-height:500px; overflow-y:auto;"></div>
        `;
    }

    async function salvarNota() {
        const titulo = document.getElementById('notaTitulo').value.trim();
        const texto = document.getElementById('notaTexto').value.trim();
        if (!titulo || !texto) {
            if (!titulo) document.getElementById('notaTitulo').classList.add('invalid');
            if (!texto) document.getElementById('notaTexto').classList.add('invalid');
            return;
        }
        document.getElementById('notaTitulo').classList.remove('invalid');
        document.getElementById('notaTexto').classList.remove('invalid');

        showWinProgress("Salvando anotação...");
        const agora = new Date();
        await db.ref('anotacoes').push({
            titulo,
            texto,
            data: agora.toLocaleDateString('pt-BR'),
            hora: agora.toLocaleTimeString('pt-BR')
        });
        document.getElementById('notaTitulo').value = '';
        document.getElementById('notaTexto').value = '';
        closeModal('modalNovaNota');
        hideWinProgress();
        showDevName();
    }

    function verNota(id, n) {
        document.getElementById('verTitulo').innerText = n.titulo;
        document.getElementById('verData').innerText = `${n.data} ${n.hora}`;
        document.getElementById('verTexto').innerText = n.texto;
        document.getElementById('btnExcluirNota').onclick = async () => {
            if (confirm("Excluir esta anotação?")) {
                showWinProgress("Excluindo...");
                await db.ref('anotacoes/' + id).remove();
                hideWinProgress();
                closeModal('modalVerNota');
            }
        };
        document.getElementById('btnPdf').onclick = () => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text(n.titulo, 20, 20);
            doc.text(`${n.data} ${n.hora}`, 20, 30);
            doc.text(doc.splitTextToSize(n.texto, 170), 20, 45);
            doc.save(`anotacao.pdf`);
        };
        openModal('modalVerNota');
    }

    // ========== FERRAMENTA: PÂNICO ==========
    function renderPanic(container) {
        db.ref('panico_logs').on('value', snap => {
            const lista = document.getElementById('listaPanic');
            if (!lista) return;
            lista.innerHTML = '';
            const data = snap.val();
            if (data) {
                Object.keys(data).reverse().forEach(id => {
                    const p = data[id];
                    const div = document.createElement('div');
                    div.className = 'list-item';
                    div.innerHTML = `
                        <span>${p.data} às ${p.hora}</span>
                        <button style="background:var(--danger);color:white;border:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px;" onclick="excluirPanico('${id}')">✕</button>
                    `;

                });

    async function registrarPanico() {
        const agora = new Date();
        showWinProgress("Registrando ocorrência...");
        await db.ref('panico_logs').push({
            data: agora.toLocaleDateString('pt-BR'),
            hora: agora.toLocaleTimeString('pt-BR')
        });
        hideWinProgress();
        showDevName();
    }

    async function excluirPanico(id) {
        if (confirm("Excluir este registro?")) {
            showWinProgress("Excluindo...");
            await db.ref('panico_logs/' + id).remove();
            hideWinProgress();
        }
    }

    // ========== INICIALIZAÇÃO ==========
    document.addEventListener('DOMContentLoaded', () => {
        // Abre a ferramenta inicial (Cadastros por padrão)
        abrirFerramenta('cadastros');
        hideWinProgress();
        hideDevName();

        // Sincroniza dados globais
        db.ref('users').on('value', snap => {
            USERS = snap.val() || {};
            if (activeTool === 'cadastros') renderTable();
        });
        db.ref('chaves').on('value', snap => {
            KEYS_DATA = snap.val() || {};
            if (activeTool === 'chaves') renderKeysGrid();

            aulasExpData = snap.val() || {};

            if (activeTool === 'panic') { /* renderPanic já tem listener */ }

    function hideDevName() {
        document.getElementById('devOverlay').classList.remove('active');

    // Fechar menu mobile ao redimensionar
    window.addEventListener('resize', () => {
        if (window.innerWidth > 900) {
            closeMenu();
        }
    });
