<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>DomusFit · Acesso</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#fff;font-family:Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;color:#202124;overflow:hidden}
.app-header{background:#fff;height:66px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:500;box-shadow:0 1px 5px #172b4d0d;width:100%}
.header-brand{color:#173d77;font:700 19px Arial,sans-serif;display:flex;align-items:center;gap:11px}
.main{width:100%;max-width:420px;margin:0 auto;padding:40px 20px;flex:1;display:flex;align-items:center;justify-content:center}
.welcome-text{text-align:center;color:#657080;font-size:14px;line-height:1.6}
.menu-flutuante{position:fixed;bottom:0;left:0;right:0;width:100%;background:#173d77;border-radius:24px 24px 0 0;padding:30px 24px 40px;z-index:1000;box-shadow:0 -10px 30px rgba(23,43,77,.2);transform:translateY(100%);transition:transform .4s cubic-bezier(0.4, 0, 0.2, 1);display:flex;flex-direction:column;gap:16px}
.menu-flutuante.aberto{transform:translateY(0)}
.menu-titulo{color:#fff;font-size:20px;font-weight:700;margin-bottom:10px;text-align:center}
.campo{width:100%;display:flex;flex-direction:column;align-items:center}
.field{width:100%;height:50px;background:#fff;border:0;border-radius:25px;padding:0 20px;color:#202124;font:16px Arial,sans-serif;outline:none;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,.1)}
.field::placeholder{color:#888}
.btn{width:100%;height:50px;background:#1955ad;color:#fff;border:0;border-radius:25px;font:italic 16px Arial,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:background .2s}
.btn:hover{background:#12458f}
.spinner{width:20px;height:20px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
.btn.loading .spinner{display:inline-block}
.btn.loading .btn-text{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);background:#d6392a;color:#fff;padding:11px 20px;font-size:13px;z-index:2500;border-radius:4px;box-shadow:0 5px 18px rgba(23,43,77,.22);animation:toastIn .2s ease;display:none}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
</head>
<body>

<header class="app-header">
  <div class="header-brand"><span>DomusFit</span></div>
</header>

<main class="main">
  <div class="welcome-text">
    Toque na tela ou deslize para cima para acessar o sistema.
  </div>
</main>

<div class="menu-flutuante" id="menuAcesso">
  <div class="menu-titulo">Acessar Conta</div>
  <div class="campo">
    <input type="text" id="naInput" class="field" placeholder="Digite seu NA (Número de Acesso)" autocomplete="off" inputmode="numeric">
  </div>
  <button class="btn" id="btnAcessar">
    <span class="spinner"></span>
    <span class="btn-text">Acessar</span>
  </button>
</div>

<div class="toast" id="toastErro">NA não encontrado. Verifique e tente novamente.</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyBPiznHCVkTAgx6m02bZB8b0FFaot9UkBU",authDomain:"prefeitura-de-joao-camara.firebaseapp.com",projectId:"prefeitura-de-joao-camara",storageBucket:"prefeitura-de-joao-camara.firebasestorage.app",databaseURL:"https://prefeitura-de-joao-camara-default-rtdb.firebaseio.com"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

const menuAcesso=document.getElementById("menuAcesso");
const naInput=document.getElementById("naInput");
const btnAcessar=document.getElementById("btnAcessar");
const toastErro=document.getElementById("toastErro");

function mostrarMenu(){
  menuAcesso.classList.add("aberto");
  setTimeout(()=>naInput.focus(),400);
}

setTimeout(mostrarMenu, 500);

document.body.addEventListener("click", function(e){
  if(!menuAcesso.classList.contains("aberto") && !menuAcesso.contains(e.target)){
    mostrarMenu();
  }
});

let touchStartY = 0;
document.addEventListener("touchstart", e => { touchStartY = e.touches[0].clientY; });
document.addEventListener("touchend", e => {
  const touchEndY = e.changedTouches[0].clientY;
  if (touchStartY - touchEndY > 50 && !menuAcesso.classList.contains("aberto")) {
    mostrarMenu();
  }
});

function mostrarErro(msg){
  toastErro.textContent = msg;
  toastErro.style.display = "block";
  setTimeout(()=>{ toastErro.style.display = "none"; }, 3000);
}

btnAcessar.onclick = async () => {
  const na = naInput.value.trim();
  if(!na){
    mostrarErro("Informe o NA cadastrado.");
    return;
  }
  btnAcessar.classList.add("loading");
  btnAcessar.disabled = true;
  
  try {
    const snap = await db.ref("usuarios/" + na).once("value");
    if(snap.exists()){
      localStorage.setItem("usuarioAtual", na);
      window.location.href = "index2.html";
    } else {
      btnAcessar.classList.remove("loading");
      btnAcessar.disabled = false;
      mostrarErro("NA não encontrado. Verifique e tente novamente.");
    }
  } catch (error) {
    console.error(error);
    btnAcessar.classList.remove("loading");
    btnAcessar.disabled = false;
    mostrarErro("Erro de conexão. Tente novamente.");
  }
};

naInput.addEventListener("keydown", e => {
  if(e.key === "Enter"){
    btnAcessar.click();
  }
});
</script>
</body>
</html>
