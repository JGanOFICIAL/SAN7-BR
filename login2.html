<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#245caa">
<title>San7Doc Tecnologia</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:#282d35;background:#fff}
body{min-height:100vh}
button,input{font:inherit}
.page{min-height:100vh;display:flex;flex-direction:column}
.welcome{position:relative;min-height:220px;background:linear-gradient(135deg,#e9ebef,#cfd4dc);color:#30343a;display:grid;place-items:center;text-align:center;padding:20px;overflow:hidden}
.welcome-bg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);max-width:60%;max-height:70%;object-fit:contain;opacity:.35;pointer-events:none;z-index:0}
.welcome-content{position:relative;z-index:1}
.welcome h1{font-size:24px;margin:0 0 7px}
.welcome p{font-size:11px;margin:0;opacity:.85}
.form{position:relative;width:min(390px,calc(100% - 36px));margin:auto;padding:48px 0 28px;display:flex;flex-direction:column;justify-content:center;flex:1}
.form h2{text-align:center;font-size:19px;margin:0 0 6px}
.hint{text-align:center;color:#858b94;font-size:11px;margin-bottom:20px}
.input{width:100%;height:44px;border:1px solid #cfd3d9;border-radius:23px;margin-bottom:12px;padding:0 15px;font-size:13px;outline:none;text-align:center;background:#fff;color:#282d35}
.input:focus{border-color:#245caa;box-shadow:0 0 0 2px #245caa20}
.access{height:43px;border:0;border-radius:4px;background:#245caa;color:#fff;font-size:11px;font-weight:700;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:9px}
.access:active{background:#fff;color:#245caa;box-shadow:inset 0 0 0 1px #245caa;transform:scale(.99)}
.access:disabled{opacity:.75;cursor:wait}
.spinner{width:16px;height:16px;border:2px solid #245caa30;border-top-color:#245caa;border-radius:50%;animation:spin .7s linear infinite;display:none;flex-shrink:0}
.access .spinner{border-color:#ffffff65;border-top-color:#fff}
.access.loading .spinner{display:inline-block}
.access.loading .button-label{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.developer{text-align:center;color:#969ba3;font-size:9px;opacity:.85;margin-top:13px}
.footer{min-height:48px;background:#f8f8f8;border-top:1px solid #ececec;display:flex;align-items:center;justify-content:center;text-align:center;padding:11px;color:#858990;font-size:9px}
.menu-trigger{position:absolute;top:12px;right:0;width:36px;height:32px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;padding:4px;z-index:2}
.menu-trigger span{display:block;width:21px;height:2px;background:#20242a;border-radius:2px;transition:transform .2s,opacity .2s}
.menu-trigger:active{transform:scale(.94)}
.overlay{position:fixed;inset:0;background:rgba(25,31,41,.48);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;opacity:0;visibility:hidden;transition:opacity .22s,visibility .22s}
.overlay.open{opacity:1;visibility:visible}
.menu-card{width:min(330px,100%);background:#fff;border-radius:3px;padding:22px;box-shadow:0 16px 45px rgba(0,0,0,.2);transform:translateY(12px) scale(.97);transition:transform .22s}
.overlay.open .menu-card{transform:translateY(0) scale(1)}
.menu-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.menu-head h3{font-size:17px;margin:0;color:#282d35}
.close-menu{width:30px;height:30px;border:0;background:#f1f3f6;color:#525a65;font-size:21px;line-height:1;cursor:pointer}
.support-button{width:100%;height:44px;border:0;border-radius:3px;background:#245caa;color:#fff;font-size:11px;font-weight:700;cursor:pointer}
.support-button:active{background:#194987}
.menu-caption{font-size:10px;color:#858b94;text-align:center;margin:14px 0 0}
.alert-overlay{position:fixed;inset:0;background:rgba(25,31,41,.42);display:flex;align-items:center;justify-content:center;padding:22px;z-index:100;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.alert-overlay.show{opacity:1;visibility:visible}
.alert-card{width:min(330px,100%);background:#fff;border-radius:4px;text-align:center;padding:27px 23px 22px;box-shadow:0 16px 45px rgba(0,0,0,.22);transform:scale(.88);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.alert-overlay.show .alert-card{transform:scale(1)}
.alert-symbol{width:48px;height:48px;border:3px solid #d94b45;border-radius:50%;color:#d94b45;display:grid;place-items:center;font-size:30px;font-weight:700;margin:0 auto 15px;animation:alertPulse 1.1s ease-in-out infinite}
@keyframes alertPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(217,75,69,0)}50%{transform:scale(1.07);box-shadow:0 0 0 7px rgba(217,75,69,.09)}}
.alert-card h3{font-size:17px;margin:0 0 8px;color:#282d35}
.alert-card p{font-size:12px;line-height:1.5;color:#727985;margin:0 0 20px}
.alert-ok{height:39px;min-width:110px;padding:0 20px;border:0;border-radius:3px;background:#245caa;color:#fff;font-size:11px;font-weight:700;cursor:pointer}
.user-panel{width:100%;text-align:center}
.user-panel h2{font-size:23px;color:#245caa;margin:0 0 9px}
.user-panel p{font-size:12px;color:#737b86;margin:7px 0}
.user-actions{display:flex;flex-direction:column;gap:10px;margin:24px auto 0;width:100%;max-width:320px}
.user-button{height:43px;border:1px solid #245caa;border-radius:4px;background:#245caa;color:#fff;font-size:11px;font-weight:700;text-decoration:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.user-button.secondary{background:#fff;color:#245caa}
.sync-state{display:flex;align-items:center;justify-content:center;gap:9px;color:#858b94;font-size:11px}
.sync-state .spinner{display:block}
@media(min-width:900px){.page{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 46px}.welcome{grid-column:1;grid-row:1;min-height:0}.welcome-bg{top:50%;left:50%;transform:translate(-50%,-50%);max-width:55%;max-height:45%;opacity:.35}.form{grid-column:2;grid-row:1;width:min(400px,85%)}.footer{grid-column:1/3;grid-row:2}}
@media(min-width:600px) and (max-width:899px){.page{display:grid;grid-template-columns:40% 60%;grid-template-rows:1fr 45px}.welcome{grid-column:1;grid-row:1;min-height:0}.welcome-bg{top:50%;left:50%;transform:translate(-50%,-50%);max-width:60%;max-height:50%;opacity:.35}.form{grid-column:2;grid-row:1;width:90%;padding:48px 18px 18px}.footer{grid-column:1/3;grid-row:2}}
@media(max-width:599px){.welcome{min-height:220px}.welcome-bg{top:50%;left:50%;transform:translate(-50%,-50%);max-width:60%;max-height:70%;opacity:.35}.form{padding:48px 0 32px}.menu-trigger{right:0;top:10px}.footer{font-size:8px}}
</style>
</head>
<body>
<main class="page">
<section class="welcome">
<img class="welcome-bg" id="welcomeBg" src="COLE_AQUI_LOGO" alt="">
<div class="welcome-content"><h1>Academia DomusFit</h1><p>Acesse sua conta para continuar</p></div>
</section>
<section class="form" id="formArea">
<button class="menu-trigger" id="menuTrigger" type="button" aria-label="Abrir menu de suporte" aria-expanded="false"><span></span><span></span><span></span></button>
<h2>Entrar na sua conta</h2>
<div class="hint">Informe seu Número de Acesso (NA)</div>
<input class="input" id="naInput" type="text" inputmode="numeric" autocomplete="off" aria-label="Número de Acesso" placeholder="Número de Acesso (NA)">
<button class="access" id="btnAcessar" type="button"><span class="spinner"></span><span class="button-label">ACESSAR</span></button>
<div class="developer">Developed by San7Doc Tecnologia</div>
</section>
<footer class="footer">© 2026 San7Doc Tecnologia. All rights reserved. • Terms of Use • Privacy Policy</footer>
</main>
<div class="overlay" id="menuOverlay" aria-hidden="true">
<div class="menu-card" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
<div class="menu-head"><h3 id="menuTitle">Menu</h3><button class="close-menu" id="closeMenu" type="button" aria-label="Fechar menu">×</button></div>
<button class="support-button" id="supportButton" type="button">ENTRAR EM CONTATO COM O SUPORTE</button>
<p class="menu-caption">San7Doc Tecnologia</p>
</div>
</div>
<div class="alert-overlay" id="alertOverlay" aria-hidden="true">
<div class="alert-card" role="alertdialog" aria-modal="true" aria-labelledby="alertTitle" aria-describedby="alertMessage">
<div class="alert-symbol">!</div>
<h3 id="alertTitle">Atenção</h3>
<p id="alertMessage"></p>
<button class="alert-ok" id="alertOk" type="button">ENTENDI</button>
</div>
</div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
'use strict';
const LOGO_URL='https://thumb.wikimedia.org/wikipedia/commons/thumb/6/67/Crystal_Clear_app_Login_Manager.svg/3840px-Crystal_Clear_app_Login_Manager.svg.png?utm_source=pt.wikipedia.org&utm_campaign=index&utm_content=thumbnail';
const LOGO_WIDTH_PX=220;
const firebaseConfig={apiKey:"AIzaSyBPiznHCVkTAgx6m02bZB8b0FFaot9UkBU",authDomain:"prefeitura-de-joao-camara.firebaseapp.com",projectId:"prefeitura-de-joao-camara",storageBucket:"prefeitura-de-joao-camara.firebasestorage.app",databaseURL:"https://prefeitura-de-joao-camara-default-rtdb.firebaseio.com"};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const formArea=document.getElementById('formArea');
const menuOverlay=document.getElementById('menuOverlay');
const menuTrigger=document.getElementById('menuTrigger');
const closeMenu=document.getElementById('closeMenu');
const supportButton=document.getElementById('supportButton');
const alertOverlay=document.getElementById('alertOverlay');
const alertTitle=document.getElementById('alertTitle');
const alertMessage=document.getElementById('alertMessage');
const alertOk=document.getElementById('alertOk');
let currentUser=localStorage.getItem('usuarioAtual');
function configurarLogomarca(){const bg=document.getElementById('welcomeBg');if(!bg)return;bg.style.width=LOGO_WIDTH_PX+'px';bg.style.height='auto';if(LOGO_URL&&LOGO_URL!=='COLE_AQUI_LOGO'){bg.src=LOGO_URL;bg.style.display='block'}else{bg.removeAttribute('src');bg.style.display='none'}}
function mostrarAlerta(mensagem,titulo='Atenção'){alertTitle.textContent=titulo;alertMessage.textContent=mensagem;alertOverlay.classList.add('show');alertOverlay.setAttribute('aria-hidden','false')}
function fecharAlerta(){alertOverlay.classList.remove('show');alertOverlay.setAttribute('aria-hidden','true')}
function abrirMenu(){menuOverlay.classList.add('open');menuOverlay.setAttribute('aria-hidden','false');const trigger=document.getElementById('menuTrigger');if(trigger)trigger.setAttribute('aria-expanded','true')}
function fecharMenu(){menuOverlay.classList.remove('open');menuOverlay.setAttribute('aria-hidden','true');const trigger=document.getElementById('menuTrigger');if(trigger)trigger.setAttribute('aria-expanded','false')}
function ligarMenu(){const trigger=document.getElementById('menuTrigger');if(trigger)trigger.addEventListener('click',abrirMenu)}
function mostrarCarregamentoInicial(){formArea.innerHTML='<button class="menu-trigger" id="menuTrigger" type="button" aria-label="Abrir menu de suporte" aria-expanded="false"><span></span><span></span><span></span></button><div class="sync-state"><span class="spinner"></span></div>';ligarMenu()}
function mostrarFormulario(){formArea.innerHTML='<button class="menu-trigger" id="menuTrigger" type="button" aria-label="Abrir menu de suporte" aria-expanded="false"><span></span><span></span><span></span></button><h2>Entrar na sua conta</h2><div class="hint">Informe seu Número de Acesso (NA)</div><input class="input" id="naInput" type="text" inputmode="numeric" autocomplete="off" aria-label="Número de Acesso" placeholder="Número de Acesso (NA)"><button class="access" id="btnAcessar" type="button"><span class="spinner"></span><span class="button-label">ACESSAR</span></button><div class="developer">Developed by San7Doc Tecnologia</div>';ligarMenu();document.getElementById('btnAcessar').addEventListener('click',acessar);document.getElementById('naInput').addEventListener('keydown',e=>{if(e.key==='Enter')acessar()})}
function mostrarUsuario(na,dados){formArea.innerHTML='<button class="menu-trigger" id="menuTrigger" type="button" aria-label="Abrir menu de suporte" aria-expanded="false"><span></span><span></span><span></span></button><div class="user-panel"><h2 id="userName"></h2><p id="userNa"></p><p>Seus dados e informações estão salvos.</p><div class="user-actions"><a class="user-button" href="index2.html">ACESSAR PERFIL</a><button class="user-button secondary" id="btnSair" type="button">SAIR DA CONTA</button></div><div class="developer">San7Doc Tecnologia</div></div>';ligarMenu();document.getElementById('userName').textContent=dados&&dados.nome?dados.nome:'Colaborador(a)';document.getElementById('userNa').textContent='NA: '+na;document.getElementById('btnSair').addEventListener('click',()=>{localStorage.removeItem('usuarioAtual');currentUser=null;mostrarFormulario()})}
async function acessar(){const input=document.getElementById('naInput');const button=document.getElementById('btnAcessar');if(!input||!button)return;const na=input.value.trim();if(!na){mostrarAlerta('Informe seu NA cadastrado.');input.focus();return}button.classList.add('loading');button.disabled=true;input.disabled=true;try{const snap=await db.ref('usuarios/'+na).once('value');if(snap.exists()){localStorage.setItem('usuarioAtual',na);currentUser=na;mostrarUsuario(na,snap.val()||{})}else{mostrarAlerta('NA não encontrado. Verifique e tente novamente.');button.classList.remove('loading');button.disabled=false;input.disabled=false;input.focus()}}catch(error){mostrarAlerta('Não foi possível sincronizar seus dados. Verifique sua conexão e tente novamente.');button.classList.remove('loading');button.disabled=false;input.disabled=false}}
async function iniciar(){if(currentUser){mostrarCarregamentoInicial();try{const snap=await db.ref('usuarios/'+currentUser).once('value');if(snap.exists()){mostrarUsuario(currentUser,snap.val()||{})}else{localStorage.removeItem('usuarioAtual');currentUser=null;mostrarFormulario()}}catch(error){mostrarAlerta('Não foi possível sincronizar sua conta. Verifique sua conexão.');mostrarFormulario()}}else{mostrarFormulario()}}
closeMenu.addEventListener('click',fecharMenu);
menuOverlay.addEventListener('click',e=>{if(e.target===menuOverlay)fecharMenu()});
supportButton.addEventListener('click',()=>{window.open('https://wa.me/5584981783113','_blank','noopener,noreferrer');fecharMenu()});
alertOk.addEventListener('click',fecharAlerta);
alertOverlay.addEventListener('click',e=>{if(e.target===alertOverlay)fecharAlerta()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){fecharMenu();fecharAlerta()}});
configurarLogomarca();
iniciar();
</script>
</body>
</html>
