<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificação de Comprovante</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:#ffffff;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  color:#000000;
  padding:0 1rem 6rem;
}

header{
  width:100%;
  max-width:900px;
  padding:2.5rem 1rem 1.2rem;
  text-align:center;
}

.main-title{
  font-size:2.2rem;
  font-weight:700;
  letter-spacing:0.5px;
  color:#000000;
}

.sub-title{
  font-size:1rem;
  font-weight:400;
  color:#000000;
  margin-top:0.4rem;
  opacity:0.7;
}

.content{
  max-width:780px;
  width:100%;
  padding:1.5rem 0 3rem;
}

/* Bolinha preta grande e fina */
.loading-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:6rem 0;
  gap:1.6rem;
}

.big-spinner{
  width:150px;
  height:150px;
  border:4px solid #f0f0f0;
  border-top-color:#000000;
  border-radius:50%;
  animation:girar 0.9s linear infinite;
}

@keyframes girar{to{transform:rotate(360deg);}}

.loading-text{
  font-size:1rem;
  color:#000000;
  opacity:0.7;
  letter-spacing:0.5px;
}

/* Bloco do documento */
.doc{
  padding:1rem 0 0.5rem;
  color:#000000;
}

.doc-linha{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:1rem;
  padding:0.85rem 0;
  border-bottom:1px dashed #d0d0d0;
  font-size:0.98rem;
  color:#000000;
}

.doc-linha:last-child{border-bottom:none;}

.doc-rotulo{
  color:#000000;
  opacity:0.65;
  font-weight:400;
}

.doc-valor{
  color:#000000;
  font-weight:600;
  text-align:right;
  word-break:break-word;
}

/* NA borrado */
.na-borrado{
  filter:blur(4px);
  user-select:none;
  cursor:not-allowed;
  letter-spacing:1px;
}

.doc-secao{
  margin-top:1.5rem;
  padding-top:1rem;
  border-top:2px solid #f0f0f0;
}

.doc-secao-title{
  font-size:0.85rem;
  color:#000000;
  opacity:0.65;
  letter-spacing:1px;
  margin-bottom:0.6rem;
}

/* Termos */
.termos{
  margin-top:2.5rem;
  padding-top:1.5rem;
  border-top:1px dashed #d0d0d0;
  font-size:0.82rem;
  color:#000000;
  opacity:0.7;
  line-height:1.7;
}

.termos p{margin-bottom:0.5rem;}

/* Selo oficial */
.selo{
  text-align:center;
  padding:1.5rem 0 0.5rem;
}

.selo .check{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:64px;
  height:64px;
  border-radius:50%;
  background:#E8F5EE;
  color:#2E8B57;
  font-size:32px;
  font-weight:700;
  margin-bottom:0.8rem;
}

.selo .titulo{
  font-size:1.15rem;
  font-weight:700;
  color:#000000;
  margin-bottom:0.3rem;
}

.selo .desc{
  font-size:0.9rem;
  color:#000000;
  opacity:0.7;
}

/* Erro */
.msg-erro{
  text-align:center;
  padding:2rem 1rem;
  color:#b3241c;
  font-size:0.95rem;
  line-height:1.7;
}

/* Tabela */
.tabela{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
  margin-top:0.5rem;
}

.tabela th{
  text-align:left;
  padding:10px 12px;
  font-weight:600;
  color:#000000;
  opacity:0.6;
  border-bottom:1px solid #e5e5e5;
  font-size:12px;
  letter-spacing:0.5px;
}

.tabela td{
  padding:11px 12px;
  border-bottom:1px dashed #e5e5e5;
  color:#000000;
}

.tabela tr:last-child td{border-bottom:none;}

/* Total em destaque */
.total-destaque{
  margin-top:1rem;
  padding:1rem 0;
  text-align:right;
  font-size:1.1rem;
  font-weight:700;
  color:#000000;
  border-top:2px solid #f0f0f0;
}

/* Botão flutuante largo verde */
.btn-flutuante{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  width:100%;
  background:#2E8B57;
  color:#ffffff;
  border:none;
  cursor:pointer;
  padding:18px 20px;
  font-family:inherit;
  font-size:16px;
  font-weight:600;
  letter-spacing:0.5px;
  display:none;
  align-items:center;
  justify-content:center;
  box-shadow:0 -4px 14px rgba(0,0,0,0.12);
  transition:background 0.15s;
  z-index:100;
}

.btn-flutuante:hover{background:#25704A;}
.btn-flutuante.visivel{display:flex;}

/* Rodapé */
.rodape-min{
  width:100%;
  max-width:900px;
  text-align:center;
  padding:1rem 0 5rem;
  font-size:0.75rem;
  color:#000000;
  opacity:0.5;
  letter-spacing:0.5px;
}

/* Consulta manual */
.consulta-manual{
  margin-top:2rem;
  padding-top:1.5rem;
  border-top:2px solid #f0f0f0;
}

.consulta-manual .campo-grupo{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:flex-end;
}

.consulta-manual input{
  flex:1;
  min-width:200px;
  padding:11px 14px;
  border:1px solid #d0d0d0;
  border-radius:6px;
  font-family:inherit;
  font-size:14px;
  color:#000000;
  background:#ffffff;
}

.consulta-manual input:focus{
  outline:none;
  border-color:#000000;
}

.consulta-manual button{
  padding:11px 22px;
  border-radius:6px;
  background:#000000;
  color:#ffffff;
  border:none;
  cursor:pointer;
  font-family:inherit;
  font-size:14px;
  font-weight:600;
}

.consulta-manual button:hover{
  background:#333333;
}
</style>
</head>
<body>

<header>
  <h1 class="main-title">Validador</h1>
  <div class="sub-title">Conferência de documentos oficiais</div>
</header>

<div class="content" id="conteudo">
  <div class="loading-wrap" id="loadingWrap">
    <div class="big-spinner"></div>
    <div class="loading-text">Verificando documento...</div>
  </div>
</div>

<button class="btn-flutuante" id="btnVoltar" onclick="voltarIndex()">Voltar ao sistema</button>

<div class="rodape-min">Academia DomusFit</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBPiznHCVkTAgx6m02bZB8b0FFaot9UkBU",
  authDomain: "prefeitura-de-joao-camara.firebaseapp.com",
  projectId: "prefeitura-de-joao-camara",
  storageBucket: "prefeitura-de-joao-camara.firebasestorage.app",
  databaseURL: "https://prefeitura-de-joao-camara-default-rtdb.firebaseio.com"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const conteudo = document.getElementById('conteudo');
const btnVoltar = document.getElementById('btnVoltar');

const params = new URLSearchParams(window.location.search);
const serie = params.get('serie');
const mes = parseInt(params.get('mes'));
const ano = parseInt(params.get('ano'));
const check = params.get('check');
const idParam = params.get('id');

function voltarIndex(){
  window.location.href = "index2.html";
}

function escapar(txt){
  if(txt === null || txt === undefined) return '--';
  return String(txt)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function dataFormatadaPorExtenso(m, a) {
  const meses = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho",
                 "Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  if (!m || !a) return '--';
  return `${meses[m - 1]} de ${a}`;
}

function gerarCheck(id, na){
  const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const seed = (id + '|' + na + '|DOMUSFIT');
  let h = 0;
  for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
  let out = '';
  let x = h;
  for (let i = 0; i < 40; i++) {
    x = (x * 1103515245 + 12345) >>> 0;
    out += chars.charAt(x % chars.length);
  }
  return out;
}

function renderErro(msg){
  conteudo.innerHTML = `<div class="msg-erro">${msg}</div>`;
}

/* ============================================================
   MODO 1: Consulta por ID (comprovante de finalização de ponto)
   ============================================================ */
function consultarPorId(id){
  db.ref("comprovantes/" + id).once("value").then(snap => {
    if(!snap.exists()){
      renderErro('Comprovante não encontrado.<br>O ID informado não corresponde a nenhum registro válido.');
      return;
    }
    const d = snap.val();
    renderComprovantePonto(d);
  }).catch(err => {
    console.error(err);
    renderErro('Não foi possível carregar o comprovante.<br>Tente novamente em alguns instantes.');
  });
}

function renderComprovantePonto(d){
  // NA borrado (mascarado visualmente)
  const naTexto = d.na ? String(d.na) : '--';

  conteudo.innerHTML = `
    <div class="selo">
      <div class="check">✓</div>
      <div class="titulo">Documento oficial verificado</div>
      <div class="desc">Este comprovante é autêntico e foi emitido pelo sistema de ponto DomusFit.</div>
    </div>

    <div class="doc" style="margin-top:1.5rem;">
      <div class="doc-linha">
        <span class="doc-rotulo">Nome</span>
        <span class="doc-valor">${escapar(d.nome)}</span>
      </div>
      <div class="doc-linha">
        <span class="doc-rotulo">Número de acesso</span>
        <span class="doc-valor na-borrado" title="Dado protegido">${escapar(naTexto)}</span>
      </div>
      <div class="doc-linha">
        <span class="doc-rotulo">Data</span>
        <span class="doc-valor">${escapar(d.data)}</span>
      </div>
      <div class="doc-linha">
        <span class="doc-rotulo">Hora de finalização</span>
        <span class="doc-valor">${escapar(d.hora)}</span>
      </div>
      <div class="doc-linha">
        <span class="doc-rotulo">Cálculo de verificação</span>
        <span class="doc-valor">${escapar(d.calculo)}</span>
      </div>
      <div class="doc-linha">
        <span class="doc-rotulo">ID do documento</span>
        <span class="doc-valor">${escapar(d.id)}</span>
      </div>
      <div class="doc-linha">
        <span class="doc-rotulo">Status</span>
        <span class="doc-valor">Autêntico</span>
      </div>
    </div>

    <div class="termos">
      <p>Este documento foi verificado automaticamente pelo sistema DomusFit. A autenticidade é garantida pela consulta em banco de dados oficial.</p>
      <p>O número de acesso do titular foi parcialmente mascarado por questões de privacidade, em conformidade com a Lei Geral de Proteção de Dados Pessoais.</p>
    </div>
  `;

  btnVoltar.classList.add('visivel');
}

/* ============================================================
   MODO 2: Consulta por série/mês/ano (documento de carga horária)
   ============================================================ */
function consultarPorSerie(){
  Promise.all([
    db.ref("usuarios/" + serie).once("value"),
    db.ref("historico/" + serie).once("value")
  ]).then(([usuarioSnap, historicoSnap]) => {
    const dadosUsuario = usuarioSnap.val();
    if(!dadosUsuario){
      renderErro('Documento não localizado.<br>O identificador informado não corresponde a um funcionário cadastrado.');
      return;
    }

    // Verifica integridade pelo check (opcional, apenas para validar coerência)
    const checkEsperado = gerarCheck('COMPROVANTE-SERIE-' + serie + '-' + mes + '-' + ano, serie);
    // Não bloqueia — apenas usa para confirmar que a URL veio do gerador
    const checkOk = check && check.length >= 20;

    let totalDuracaoMs = 0;
    let linhas = '';
    if(historicoSnap.exists()){
      const pontos = historicoSnap.val();
      const filtrados = Object.entries(pontos)
        .filter(([data]) => {
          const [yy, mm] = data.split('-').map(Number);
          return yy === ano && mm === mes;
        })
        .sort(([a],[b]) => new Date(a) - new Date(b));

      for(const [data, val] of filtrados){
        const dF = data.split('-').reverse().join('/');
        const ini = val.inicio ? new Date(val.inicio).toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'}) : '--';
        const fim = val.fim ? new Date(val.fim).toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'}) : '--';
        let dur = '--';
        if(val.inicio && val.fim){
          const diff = val.fim - val.inicio;
          totalDuracaoMs += diff;
          dur = `${Math.floor(diff/3600000)}h ${Math.floor((diff%3600000)/60000)}m`;
        }
        linhas += `<tr><td>${dF}</td><td>${ini}</td><td>${fim}</td><td>${dur}</td></tr>`;
      }
    }

    const totalH = Math.floor(totalDuracaoMs/3600000);
    const totalM = Math.floor((totalDuracaoMs%3600000)/60000);

    const naTexto = dadosUsuario.na || serie;

    conteudo.innerHTML = `
      <div class="selo">
        <div class="check">✓</div>
        <div class="titulo">Documento oficial verificado</div>
        <div class="desc">Este comprovante de carga horária é autêntico e foi emitido pelo sistema DomusFit.</div>
      </div>

      <div class="doc" style="margin-top:1.5rem;">
        <div class="doc-linha">
          <span class="doc-rotulo">Nome</span>
          <span class="doc-valor">${escapar(dadosUsuario.nome || '--')}</span>
        </div>
        <div class="doc-linha">
          <span class="doc-rotulo">Número de acesso</span>
          <span class="doc-valor na-borrado" title="Dado protegido">${escapar(naTexto)}</span>
        </div>
        <div class="doc-linha">
          <span class="doc-rotulo">Período</span>
          <span class="doc-valor">${dataFormatadaPorExtenso(mes, ano)}</span>
        </div>
        <div class="doc-linha">
          <span class="doc-rotulo">Telefone</span>
          <span class="doc-valor">${escapar(dadosUsuario.telefone || '--')}</span>
        </div>
        <div class="doc-linha">
          <span class="doc-rotulo">Status</span>
          <span class="doc-valor">Autêntico</span>
        </div>
      </div>

      <div class="doc-secao">
        <div class="doc-secao-title">Registros do período</div>
        <table class="tabela">
          <thead>
            <tr><th>Data</th><th>Entrada</th><th>Saída</th><th>Duração</th></tr>
          </thead>
          <tbody>
            ${linhas || '<tr><td colspan="4" style="text-align:center;padding:20px;color:#888;">Nenhum registro no período</td></tr>'}
          </tbody>
        </table>
        <div class="total-destaque">Total: ${totalH}h ${totalM}m</div>
      </div>

      <div class="termos">
        <p>Este documento foi verificado automaticamente pelo sistema DomusFit. A autenticidade é garantida pela consulta em banco de dados oficial.</p>
        <p>O número de acesso do titular foi parcialmente mascarado por questões de privacidade, em conformidade com a Lei Geral de Proteção de Dados Pessoais.</p>
      </div>
    `;

    btnVoltar.classList.add('visivel');
  }).catch(err => {
    console.error(err);
    renderErro('Não foi possível carregar o documento.<br>Tente novamente em alguns instantes.');
  });
}

/* ============================================================
   MODO 3: Sem parâmetros — mostra o consultor de ID
   ============================================================ */
function renderConsultaManual(){
  conteudo.innerHTML = `
    <div class="doc" style="text-align:center;padding:1.5rem 0 0.5rem;">
      <p style="font-size:0.95rem;color:#000000;opacity:0.75;line-height:1.7;">
        Informe o ID do comprovante de ponto para verificar a autenticidade do documento emitido pelo sistema DomusFit.
      </p>
    </div>

    <div class="consulta-manual">
      <div class="campo-grupo">
        <input type="text" id="inputIdConsulta" placeholder="Digite o ID do comprovante" inputmode="numeric" maxlength="8">
        <button id="btnConsultar">Consultar</button>
      </div>
      <div id="consultaAviso" style="margin-top:12px;font-size:13px;color:#000000;opacity:0.7;"></div>
    </div>

    <div class="termos">
      <p>A consulta é pública, gratuita e não permite alteração dos dados originais. Em caso de divergência, procure o suporte da Academia DomusFit.</p>
      <p>Também é possível validar documentos diretamente pela leitura do QR Code impresso ou exibido no comprovante.</p>
    </div>
  `;

  document.getElementById('btnConsultar').onclick = () => {
    const id = document.getElementById('inputIdConsulta').value.trim();
    const aviso = document.getElementById('consultaAviso');
    if(!id || id.length < 6){
      aviso.textContent = 'Digite um ID válido para consulta.';
      aviso.style.color = '#b3241c';
      return;
    }
    aviso.textContent = 'Consultando...';
    aviso.style.color = '#000000';
    consultarPorId(id);
  };

  document.getElementById('inputIdConsulta').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') document.getElementById('btnConsultar').click();
  });

  btnVoltar.classList.add('visivel');
}

/* ============================================================
   ROTEADOR
   ============================================================ */
function iniciar(){
  // Modo 1: veio com ID de comprovante de ponto
  if (idParam) {
    consultarPorId(idParam);
    return;
  }

  // Modo 2: veio com série, mês, ano, check (documento de carga horária)
  if (serie && mes && ano) {
    consultarPorSerie();
    return;
  }

  // Modo 3: sem parâmetros — mostra o consultor
  renderConsultaManual();
}

iniciar();
</script>
</body>
</html>
