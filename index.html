<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Dashboard - Academia</title>
<style>
:root{
  --green:#2e7d32;
  --green-hover:#1b5e20;
  --white:#ffffff;
  --border:#e9eef3;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter', system-ui, -apple-system, sans-serif}

html, body {
  height: 100%;
}

body{
  min-height:100vh;
  background: var(--green);
  color: var(--white);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  overflow-x: hidden;
}

/* Container Principal */
.welcome-wrap {
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

/* Logo */
.logo-top {
  height: 56px;
  width: auto;
  margin-bottom: 32px;
}

/* Título Boas-Vindas */
.welcome-title {
  font-size: 24px;
  font-weight: 700;
  color: #ffffff;
  margin-bottom: 10px;
  letter-spacing: -0.3px;
}

.welcome-sub {
  font-size: 15px;
  color: rgba(255, 255, 255, 0.85);
  margin-bottom: 36px;
  line-height: 1.5;
}

/* Botão Acessar - Branco sólido */
.btn-acessar {
  width: 100%;
  max-width: 340px;
  padding: 16px 24px;
  background: #ffffff;
  color: #1e293b;
  border: none;
  border-radius: 6px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.2s;
  margin-bottom: 14px;
  letter-spacing: 0.3px;
}
.btn-acessar:hover { opacity: 0.92; }
.btn-acessar:active { opacity: 0.85; }

/* Botão Sair - Transparente com borda branca */
.btn-sair {
  width: 100%;
  max-width: 340px;
  padding: 16px 24px;
  background: transparent;
  color: #ffffff;
  border: 2px solid #ffffff;
  border-radius: 6px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.2s;
  margin-bottom: 36px;
  letter-spacing: 0.3px;
}
.btn-sair:hover { background: rgba(255, 255, 255, 0.12); }
.btn-sair:active { background: rgba(255, 255, 255, 0.2); }

/* Plano do Usuário */
.plano-info {
  width: 100%;
  max-width: 340px;
  padding: 18px 20px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 6px;
  text-align: center;
}
.plano-info .plano-titulo {
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: rgba(255, 255, 255, 0.75);
  margin-bottom: 8px;
  font-weight: 600;
}
.plano-info .plano-nome {
  font-size: 18px;
  font-weight: 700;
  color: #ffffff;
  margin-bottom: 6px;
}
.plano-info .plano-dias {
  font-size: 14px;
  color: rgba(255, 255, 255, 0.9);
  line-height: 1.5;
}
.plano-info .plano-aviso {
  font-size: 12px;
  color: rgba(255, 255, 255, 0.7);
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid rgba(255, 255, 255, 0.15);
  line-height: 1.5;
}

/* Loading */
#loadingScreen{
  position:fixed;
  inset:0;
  background: var(--green);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  transition:opacity .4s;
}
.spinner{
  width:44px;
  height:44px;
  border:4px solid rgba(255, 255, 255, 0.25);
  border-top:4px solid #ffffff;
  border-radius:50%;
  animation:spin 0.9s linear infinite;
}
@keyframes spin{
  0%{transform:rotate(0deg)}
  100%{transform:rotate(360deg)}
}

@media (max-width: 480px) {
  .welcome-title { font-size: 22px; }
  .welcome-sub { font-size: 14px; margin-bottom: 30px; }
  .logo-top { height: 48px; margin-bottom: 24px; }
}
</style>
</head>
<body>

<div id="loadingScreen">
    <div class="spinner"></div>
</div>

<div class="welcome-wrap">

  <img src="https://c2a6771173.cbaul-cdnwnd.com/4f0c8b93cda84ae8665e2b589652cf30/200000005-62d7c62d7e/700/9A9000A9-FCA5-4306-876F-28C2D3211763.webp" class="logo-top" alt="DomusFit">

  <h1 class="welcome-title">Bem-vindo de volta!</h1>
  <p class="welcome-sub" id="welcomeSub">Carregando...</p>

  <button class="btn-acessar" onclick="window.location.href='index.html'">ACESSAR</button>
  <button class="btn-sair" onclick="logout()">SAIR</button>

  <div class="plano-info" id="planoInfoBox">
    <div class="plano-titulo">Seu Plano</div>
    <div class="plano-nome" id="planoNome">Carregando...</div>
    <div class="plano-dias" id="planoDias">Aguarde...</div>
    <div class="plano-aviso">Para renovar, fale com a administração da academia.</div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
// Configuração Firebase
const firebaseConfig = {
  apiKey: "AIzaSyBPiznHCVkTAgx6m02bZB8b0FFaot9UkBU",
  authDomain: "prefeitura-de-joao-camara.firebaseapp.com",
  projectId: "prefeitura-de-joao-camara",
  storageBucket: "prefeitura-de-joao-camara.firebasestorage.app",
  messagingSenderId: "269299041577",
  appId: "1:269299041577:web:fd41b2939240e9eb476338",
  measurementId: "G-YT7NHR342J"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Verificação de autenticação
const logged = localStorage.getItem('loggedUser');
if (!logged) {
  window.location.href = 'login.html';
}

const welcomeSubEl = document.getElementById('welcomeSub');
const planoNomeEl = document.getElementById('planoNome');
const planoDiasEl = document.getElementById('planoDias');

// Função para calcular dias restantes
function calcularDiasRestantes(dataTermino) {
  if (!dataTermino) return null;
  const hoje = new Date();
  hoje.setHours(0, 0, 0, 0);
  const termino = new Date(dataTermino + 'T00:00:00');
  termino.setHours(0, 0, 0, 0);
  const diff = Math.ceil((termino - hoje) / (1000 * 60 * 60 * 24));
  return diff;
}

// Monitoramento em Tempo Real
if (logged) {
  const userRef = db.ref('users/' + logged);
  userRef.on('value', snap => {
    if (!snap.exists()) {
      alert('Usuário não encontrado.');
      logout();
      return;
    }

    const u = snap.val();
    const hoje = new Date().toISOString().slice(0, 10);

    // Verificação de Atividade
    if (u.endDate && u.endDate < hoje) {
      alert('Seu plano está expirado. Fale com a administração para renovar.');
      // Continua mostrando a tela, mas com aviso
    }

    // Nome de boas-vindas
    const primeiroNome = (u.name || 'Aluno').split(' ')[0];
    welcomeSubEl.textContent = 'Olá, ' + primeiroNome + '!';

    // Plano
    planoNomeEl.textContent = u.planName || 'Sem plano';

    // Dias restantes
    if (u.endDate) {
      const dias = calcularDiasRestantes(u.endDate);
      if (dias < 0) {
        planoDiasEl.textContent = 'Plano expirado em ' + u.endDate + '. Fale com a administração.';
      } else if (dias === 0) {
        planoDiasEl.textContent = 'Seu plano expira hoje.';
      } else if (dias === 1) {
        planoDiasEl.textContent = 'Falta 1 dia para expirar.';
      } else {
        planoDiasEl.textContent = 'Faltam ' + dias + ' dias para expirar.';
      }
    } else {
      planoDiasEl.textContent = 'Data de expiração não informada.';
    }

    // Esconde loading
    const loading = document.getElementById('loadingScreen');
    loading.style.opacity = '0';
    setTimeout(() => { loading.style.display = 'none'; }, 400);
  }, err => {
    console.error(err);
    document.getElementById('loadingScreen').style.display = 'none';
  });
}

function logout() {
  localStorage.removeItem('loggedUser');
  window.location.href = 'login.html';
}
</script>

</body>
</html>
