<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Ponto DomusFit</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

:root{
  --azul:#1351B4;
  --azul-escuro:#0C326F;
  --azul-suave:#E8F0FB;
  --verde:#168821;
  --vermelho:#D6392A;
  --amarelo:#E8A33D;
  --amarelo-bg:#FFF9E6;
  --amarelo-borda:#F2E2A8;
  --cinza-50:#FFFFFF;
  --cinza-100:#F7F7F7;
  --cinza-200:#EEEEEE;
  --cinza-300:#D9D9D9;
  --cinza-500:#666666;
  --cinza-700:#333333;
  --cinza-900:#111111;
  --branco:#FFFFFF;
  --rodape-bg:#F2F2F2;
  --radius:10px;
}

html,body{height:100%;}
body{
  background:var(--branco);
  font-family:'Inter','Segoe UI',Arial,sans-serif;
  color:var(--cinza-900);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  font-size:15px;
  line-height:1.5;
}

/* ============ HEADER ============ */
.header{
  background:var(--azul);
  color:var(--branco);
  padding:0 20px;
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:100;
}

.header-brand{
  font-weight:700;
  font-size:17px;
  letter-spacing:-0.2px;
  color:var(--branco);
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:12px;
}

.header-brand .back-btn{
  background:rgba(255,255,255,0.15);
  border:none;
  color:var(--branco);
  padding:6px 14px;
  border-radius:var(--radius);
  font-family:inherit;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  display:none;
  transition:background 0.15s;
}
.header-brand .back-btn:hover{background:rgba(255,255,255,0.28);}
.header-brand .back-btn.visivel{display:inline-block;}

.header-right{
  display:flex;
  align-items:center;
  gap:8px;
}

.user-btn{
  background:rgba(255,255,255,0.15);
  border:none;
  color:var(--branco);
  padding:6px 12px;
  border-radius:var(--radius);
  display:flex;
  align-items:center;
  gap:8px;
  cursor:pointer;
  font-family:inherit;
  font-size:13px;
  font-weight:500;
  transition:background 0.15s;
}
.user-btn:hover{background:rgba(255,255,255,0.28);}
.user-btn .avatar-mini{
  width:26px;height:26px;border-radius:50%;
  object-fit:cover;background:var(--azul-suave);
}

.menu-btn{
  background:transparent;
  border:none;
  color:var(--branco);
  width:38px;height:38px;
  border-radius:var(--radius);
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  transition:background 0.15s;
}
.menu-btn:hover{background:rgba(255,255,255,0.15);}
.menu-btn span{
  display:block;
  width:20px;height:2px;
  background:var(--branco);
  border-radius:2px;
}

.menu-dots{position:relative;}

.menu-dropdown{
  position:absolute;
  top:46px;
  right:0;
  background:var(--branco);
  min-width:220px;
  display:none;
  z-index:200;
  box-shadow:0 6px 20px rgba(0,0,0,0.18);
  border-radius:var(--radius);
  overflow:hidden;
  border:1px solid var(--cinza-200);
}
.menu-dropdown.aberto{display:block;}
.menu-dropdown .item{
  padding:12px 18px;cursor:pointer;font-size:14px;color:var(--cinza-900);
}
.menu-dropdown .item:hover{background:var(--azul-suave);color:var(--azul);}
.menu-dropdown .divider{height:1px;background:var(--cinza-200);}

/* ============ BARRA DE PESQUISA ============ */
.search-wrap{
  background:var(--branco);
  padding:14px 20px 4px;
  max-width:900px;
  margin:0 auto;
  width:100%;
}
.search-box{
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--cinza-100);
  border:1px solid var(--cinza-200);
  border-radius:999px;
  padding:10px 16px;
  transition:border-color 0.15s, background 0.15s;
}
.search-box:focus-within{
  border-color:var(--azul);
  background:var(--branco);
}
.search-box svg{flex-shrink:0;opacity:0.5;}
.search-box input{
  border:none;
  outline:none;
  background:transparent;
  font-family:inherit;
  font-size:14px;
  color:var(--cinza-900);
  width:100%;
}
.search-box input::placeholder{color:var(--cinza-500);}

/* ============ MAIN ============ */
.main{
  flex:1;
  width:100%;
  max-width:900px;
  margin:0 auto;
  padding:10px 20px 24px;
}

/* ============ CARDS DE FUNÇÕES ============ */
.funcoes-lista{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-top:8px;
}

.funcao-card{
  background:var(--branco);
  border:1px solid var(--cinza-200);
  border-radius:var(--radius);
  padding:18px 20px;
  cursor:pointer;
  transition:all 0.15s;
  display:flex;
  align-items:center;
  gap:16px;
}
.funcao-card:hover{
  border-color:var(--azul);
  box-shadow:0 4px 14px rgba(19,81,180,0.10);
  transform:translateY(-1px);
}
.funcao-card:active{transform:translateY(0);}

.funcao-icon{
  width:46px;height:46px;
  border-radius:12px;
  background:var(--azul-suave);
  color:var(--azul);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
.funcao-icon svg{width:24px;height:24px;}

.funcao-info{flex:1;min-width:0;}
.funcao-titulo{
  font-size:15px;
  font-weight:700;
  color:var(--cinza-900);
  margin-bottom:2px;
}
.funcao-desc{
  font-size:13px;
  color:var(--cinza-500);
  line-height:1.4;
}
.funcao-arrow{
  color:var(--cinza-300);
  flex-shrink:0;
}

/* ============ RODAPÉ ============ */
.footer{
  background:var(--rodape-bg);
  padding:20px;
  margin-top:auto;
  border-top:1px solid var(--cinza-200);
}
.footer-inner{
  max-width:900px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.footer-brand{
  font-size:13px;
  font-weight:700;
  color:var(--azul-escuro);
  letter-spacing:0.3px;
}
.footer-divider{
  border:none;
  border-top:1px dashed var(--cinza-300);
  margin:2px 0;
}
.footer-links{
  display:flex;
  flex-wrap:wrap;
  gap:16px;
  font-size:12px;
  color:var(--cinza-500);
}
.footer-links span{
  cursor:pointer;
  transition:color 0.15s;
}
.footer-links span:hover{color:var(--azul);text-decoration:underline;}
.footer-copy{
  font-size:11px;
  color:var(--cinza-500);
}

/* ============ AVISO PONTO ABERTO (overlay) ============ */
.aviso-ponto{
  position:fixed;
  left:50%;
  bottom:16px;
  transform:translateX(-50%) translateY(120%);
  background:var(--amarelo-bg);
  border:1px solid var(--amarelo-borda);
  color:#7A5B00;
  border-radius:var(--radius);
  padding:14px 18px;
  display:flex;
  align-items:center;
  gap:12px;
  max-width:calc(100% - 32px);
  width:420px;
  box-shadow:0 8px 24px rgba(0,0,0,0.12);
  z-index:900;
  cursor:pointer;
  transition:transform 0.4s cubic-bezier(.2,.9,.3,1.2);
  font-size:13px;
  font-weight:500;
}
.aviso-ponto.visivel{
  transform:translateX(-50%) translateY(0);
}
.aviso-ponto .ico{
  width:34px;height:34px;
  border-radius:50%;
  background:#FFE9A8;
  color:#8A6A00;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  font-size:18px;
  font-weight:700;
}
.aviso-ponto .
